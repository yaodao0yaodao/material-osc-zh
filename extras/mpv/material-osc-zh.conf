# Rendering: gpu-next/libplacebo on native Wayland Vulkan.
vo=gpu-next
gpu-api=vulkan
gpu-context=waylandvk

# Let the compositor advertise the target display colorspace. Target mode is
# the safe default for SDR; the conditional profile below passes HDR source
# metadata through for PQ/HLG video.
target-colorspace-hint=auto
target-colorspace-hint-mode=target

# NVIDIA hardware decoding for every codec/profile supported by NVDEC.
# Unsupported content falls back to software decoding.
hwdec=nvdec
hwdec-codecs=all

volume-max=100
drag-and-drop=replace

# New videos start in material-osc's “Fit to Screen” mode.
keepaspect=yes
panscan=1

# Keep crop/subtitle state isolated per file. material-osc stores these values
# when changing playlist items, while mpv watch-later handles normal exits.
save-position-on-quit=yes
watch-later-options-append=keepaspect
reset-on-next-file-add=keepaspect,panscan,video-crop,video-aspect-override,video-zoom,video-pan-x,video-pan-y,video-scale-x,video-scale-y,sid,secondary-sid,sub-visibility,secondary-sub-visibility

# Prefer Chinese subtitle language metadata unless a per-file choice exists.
slang=zh,zh-CN,zh-Hans,chi,zho,cmn,chs,sc

# Load subtitles whose filename contains the video filename plus a language
# suffix, for example movie.scjp.ass, movie.JPSC.ass, or movie.zh-CN.srt.
sub-auto=fuzzy

# material-osc enables the official autocrop script only in Fit to Screen.
script-opts-append=autocrop-auto=no

[hyprland-hdr-source]
profile-desc=Pass PQ/HLG source metadata to a Hyprland HDR output
profile-cond=p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg"
profile-restore=copy
target-colorspace-hint=yes
target-colorspace-hint-mode=source
